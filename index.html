<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<title>Le gros front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Le gros front">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#111827;color:#f9fafb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));text-align:center;overflow-y:auto}
  .screen.active{display:flex}
  h1{margin:0 0 4px;font-size:2rem}
  p.sub{margin:0 0 20px;opacity:.7}
  .card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
  label{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:.9rem;opacity:.9}
  select,textarea,input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:1rem}
  input[type=text],input[type=password]{width:100%;padding:12px;border-radius:12px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:1rem}
  input,textarea{user-select:text;-webkit-user-select:text}
  textarea{min-height:90px;resize:vertical}
  a{color:#86efac}
  .screen.scroll{justify-content:flex-start}
  .screen.scroll>.card{margin:auto}
  .backBtn.inline{position:static;align-self:flex-start}
  .tools{display:none;gap:8px}.tools.on{display:flex}.tools>button{flex:1;padding:8px;font-size:.9rem}
  .chk{flex-direction:row;align-items:center;gap:10px;font-size:.9rem}
  .chk input{width:auto}
  .status{min-height:1.2em;font-size:.95rem;text-align:left;opacity:.9;white-space:pre-wrap}
  .status.err{color:#fca5a5}.status.ok{color:#86efac}
  details{text-align:left;font-size:.9rem}
  summary{cursor:pointer;opacity:.8;margin-bottom:8px}
  #genOut{display:none;flex-direction:column;gap:10px}#genOut.on{display:flex}
  #genList{min-height:200px;font-size:.9rem}
  button:disabled{opacity:.5;cursor:default}
  .drawers{display:flex;flex-direction:column;gap:10px}
  .drawer{border:1px solid #374151;border-radius:14px;background:#1f2937;overflow:hidden;text-align:left}
  .dHead{width:100%;display:flex;align-items:center;gap:10px;padding:14px;background:transparent;color:#f9fafb;font-size:1rem;font-weight:700;border-radius:0;text-align:left}
  .dHead .chev{transition:transform .15s;opacity:.8}
  .drawer.open .chev{transform:rotate(90deg)}
  .dSub{margin-left:auto;font-weight:500;opacity:.7;font-size:.85rem;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dBody{display:none;max-height:min(36vh,300px);overflow-y:auto;border-top:1px solid #374151;-webkit-overflow-scrolling:touch}
  .drawer.open .dBody{display:block}
  .dBody.tall{max-height:min(75vh,560px)}
  .item{display:flex;align-items:center;gap:8px;padding:0 10px 0 0;border-bottom:1px solid #2b3545}
  .item:last-child{border-bottom:0}
  .item.active{background:rgba(34,197,94,.16)}
  .iMain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 4px 12px 14px;cursor:pointer}
  .themeThumb{width:48px;height:38px;object-fit:cover;border-radius:6px;flex:none;border:1px solid var(--line);filter:saturate(.78) sepia(.08)}
  .imageCredits{padding:10px 14px 12px;border-top:1px solid var(--line-soft);font-size:.76rem;color:var(--muted);text-align:left}
  .imageCredits summary{cursor:pointer;margin:0;opacity:.8}
  .imageCredits ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
  .imageCredits a{color:var(--terracotta-dark)}
  .dot{width:11px;height:11px;border-radius:50%;border:2px solid #6b7280;flex:none}
  .item.active .dot{background:#22c55e;border-color:#22c55e}
  .iName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iCount{opacity:.55;font-size:.8rem;flex:none}
  .iActs{display:flex;gap:6px;flex:none}
  .mini{padding:6px 9px;min-width:36px;font-size:.95rem;border-radius:10px;background:#374151;color:#f9fafb;font-weight:600}
  .mini.on{background:#22c55e;color:#052e16}
  .mini.warn{background:#dc2626;color:#fff}
  .empty{padding:12px 14px;opacity:.65;font-size:.9rem}
  .more{padding:12px 14px;background:#18212f;border-bottom:1px solid #2b3545;display:flex;flex-direction:column;gap:10px}
  .more .hint{font-size:.8rem;opacity:.65;margin:0}
  .more .row button{padding:10px;font-size:.95rem}
  button{padding:16px;border:0;border-radius:14px;font-size:1.15rem;font-weight:700;background:#22c55e;color:#052e16;cursor:pointer}
  button.secondary{background:#374151;color:#f9fafb;font-weight:600;font-size:1rem;padding:12px}
  .big{font-size:min(16vw,26vh);font-weight:800;line-height:1.05;word-break:break-word;padding:0 4vw}
  .msg{font-size:min(8vw,12vh);font-weight:800;line-height:1.15}
  .small{opacity:.7;font-size:1rem;margin-top:12px}
  #game{transition:background .08s}
  #game.ok{background:#16a34a}
  #game.pass{background:#dc2626}
  #hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;font-size:1.4rem;font-weight:700;opacity:.85;pointer-events:none}
  #hud span:first-child{margin-left:96px}
  .backBtn{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;z-index:5;padding:8px 14px;font-size:.95rem;font-weight:600;border-radius:10px;background:rgba(55,65,81,.85);color:#f9fafb}
  .finishBtn{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;padding:8px 14px;font-size:.95rem;font-weight:600;border-radius:10px;background:rgba(55,65,81,.85)}
  #rotate{display:none;position:absolute;bottom:14px;font-size:.9rem;opacity:.7}
  @media (orientation:portrait){#rotate{display:block}}
  ul.res{list-style:none;padding:0;margin:0;text-align:left;max-height:34vh;overflow-y:auto;width:100%}
  ul.res li{padding:6px 10px;border-radius:8px;margin-bottom:4px;background:#1f2937}
  ul.res li.c{border-left:5px solid #22c55e}
  ul.res li.p{border-left:5px solid #ef4444;opacity:.8}
  .score{font-size:4rem;font-weight:800;margin:0}
  .row{display:flex;gap:12px}.row>*{flex:1}
  body.playing #settingsBtn{ display:none; }

  /* ---------- Warm editorial visual direction ---------- */
  :root{
    color-scheme:light;
    --paper:#f4f0e8;
    --surface:#fbf8f1;
    --surface-alt:#eee9df;
    --ink:#30332e;
    --muted:#77776d;
    --line:#d8d1c5;
    --line-soft:#e6e0d5;
    --terracotta:#c47b62;
    --terracotta-dark:#a9634d;
    --sage:#87977a;
    --sage-light:#e3e8dc;
    --ochre:#c1a36b;
    --danger:#b86e5c;
  }
  html,body{background:var(--paper);color:var(--ink)}
  body{isolation:isolate}
  #ambient{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.78}
  .screen{background:transparent}
  h1{color:var(--ink);letter-spacing:-.035em}
  p.sub,.small,.dSub{color:var(--muted)}
  a{color:var(--terracotta-dark)}
  select,textarea,input[type=number],input[type=text],input[type=password]{
    border:1px solid var(--line);border-radius:8px;background:var(--surface);
    color:var(--ink);accent-color:var(--sage)
  }
  input::placeholder,textarea::placeholder{color:#9a978d}
  button{
    border-radius:9px;background:var(--terracotta);color:#fffaf4;
    transition:background .15s ease,transform .12s ease
  }
  button:active{transform:translateY(1px)}
  button:hover:not(:disabled){background:var(--terracotta-dark)}
  button.secondary{background:var(--surface-alt);color:var(--ink);border:1px solid var(--line)}
  button.secondary:hover:not(:disabled){background:#e5ded1}
  .drawer{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  .dHead{color:var(--ink)}
  .dBody{border-top:1px solid var(--line)}
  .item{border-bottom:1px solid var(--line-soft)}
  .item.active{background:var(--sage-light)}
  .dot{border-color:#aaa99e}
  .item.active .dot{background:var(--sage);border-color:var(--sage)}
  .mini{border-radius:7px;background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);font-size:.78rem;min-width:0;padding:6px 8px}
  .mini:hover:not(:disabled){background:#e5ded1}
  .mini.on{background:var(--sage-light);color:#465440;border-color:#c5d0bb}
  .mini.warn{background:#f1dfd8;color:#854b3e;border-color:#e3c6bb}
  .more{background:#f1ede4;border-bottom:1px solid var(--line);border-radius:0}
  .status{color:var(--muted)}
  .status.err{color:#a65343}.status.ok{color:#657b59}
  #game{background:transparent;color:var(--ink)}
  #game.ok{background:#87977a;color:#fffaf4}
  #game.pass{background:#c47b62;color:#fffaf4}
  .backBtn,.finishBtn{background:#e8e2d7;color:var(--ink);border:1px solid var(--line);border-radius:8px}
  .backBtn:hover:not(:disabled),.finishBtn:hover:not(:disabled){background:#ded7ca}
  ul.res li{background:var(--surface-alt);border-radius:6px}
  ul.res li.c{border-left-color:var(--sage)}
  ul.res li.p{border-left-color:var(--terracotta)}
  .score{color:var(--ink)}
  .dHead .chev{color:var(--terracotta)}
  details summary{color:var(--muted)}
  input[type=checkbox],input[type=range]{accent-color:var(--sage)}
  ::selection{background:#e7d4c8;color:var(--ink)}

  /* ---------- Drawer open/close animation ---------- */
  .dBody{
    display:block;
    max-height:0;
    overflow:hidden;
    opacity:0;
    border-top:1px solid transparent;
    transition:max-height .28s cubic-bezier(.4,0,.2,1),
               opacity .22s ease,
               border-top-color .2s ease;
  }
  .drawer.open .dBody{
    max-height:min(36vh,300px);
    opacity:1;
    border-top-color:var(--line);
  }
  .drawer.open .dBody.tall{max-height:min(75vh,560px);}
  /* keep inner scrollability only when fully open */
  .dBody{overflow-y:hidden}
  .drawer.open .dBody{overflow-y:auto}
  @media (prefers-reduced-motion: reduce){
    .dBody{transition:none}
  }

  /* ---------- Settings cogwheel button (bottom right) ---------- */
  #settingsBtn{
    position:fixed;
    right:max(16px, env(safe-area-inset-right));
    bottom:max(16px, env(safe-area-inset-bottom));
    width:52px;height:52px;
    padding:0;
    border-radius:50%;
    background:var(--surface-alt);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    z-index:20;
    box-shadow:0 2px 8px rgba(48,51,46,.12);
    transition:background .15s ease, transform .12s ease;
  }
  #settingsBtn:hover{background:#e5ded1}
  #settingsBtn:active{transform:translateY(1px)}
  #settingsBtn svg{
  width:26px;
  height:26px;
  display:block;
  pointer-events:none;
  transition:transform .4s ease;
  }
  #settingsBtn:hover svg{ transform:rotate(45deg); }

  /* ---------- Floating lettering instead of big buttons ---------- */
  .floatWord,.floatWord:hover:not(:disabled){background:none;border:0;box-shadow:none}
  #startBtn{
    align-self:center;margin:22px 0 10px;padding:10px 14px;
    font-family:"Press Start 2P","Courier New",monospace;
    font-weight:400;font-size:clamp(2.2rem,12vw,3.2rem);line-height:1;letter-spacing:.04em;
    color:var(--ochre);
    text-shadow:4px 4px 0 var(--terracotta-dark);
    animation:bob 1.2s steps(2,end) infinite;
    cursor:pointer;
  }
  #startBtn:hover:not(:disabled){color:#d3b57a}
  #startBtn:active{transform:translate(3px,3px);text-shadow:1px 1px 0 var(--terracotta-dark)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .genWrap{padding:10px 14px 14px;display:flex;justify-content:center}
  .aiLink,.aiLink:hover:not(:disabled){background:none;border:0;box-shadow:none}
  .aiLink{
    display:inline-flex;align-items:center;gap:7px;padding:4px 6px;
    font-size:.95rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;
  }
  .aiLink svg{width:1.1rem;height:1.1rem;fill:var(--ochre);flex:none;transition:transform .5s ease}
  .aiLink:hover:not(:disabled){color:var(--ink)}
  .aiLink:hover svg{transform:rotate(25deg) scale(1.15)}

  /* ---------- Colour-cut action strips on the selected entry ---------- */
  .item.active{padding-right:0;align-items:stretch}
  .item.active .iMain{padding-right:8px}
  .iActs{gap:3px;align-items:stretch}
  .iActs .seg{
    width:46px;min-width:46px;padding:0;margin:0;border:0;border-radius:0;
    display:grid;place-items:center;color:#fffaf4;font-size:0;
    animation:segIn .22s ease both;
  }
  .iActs .seg:nth-child(2){animation-delay:.05s}.iActs .seg:nth-child(3){animation-delay:.1s}
  @keyframes segIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .seg svg{width:22px;height:22px;fill:currentColor;pointer-events:none}
  .seg.s-export{background:var(--sage)}.seg.s-export:hover:not(:disabled){background:#76876a}
  .seg.s-more{background:var(--ochre);color:#4a3d1f}.seg.s-more:hover:not(:disabled){background:#b09258}
  .seg.s-more.on{background:#8f7640;color:#fffaf4}
  .seg.s-clear{background:var(--terracotta)}.seg.s-clear:hover:not(:disabled){background:var(--terracotta-dark)}
  .seg.s-clear.warn{background:#8e4a39;width:76px;font-size:.8rem;font-weight:700;display:flex;gap:4px;align-items:center;justify-content:center}
  .seg.s-clear.warn svg{width:18px;height:18px}
  @media (prefers-reduced-motion: reduce){#startBtn,.iActs .seg{animation:none}}

  /* ---------- Title ---------- */
  h1#title{
    font-family:"Bagel Fat One","Chalkboard SE","Comic Sans MS",sans-serif;font-weight:400;
    font-size:clamp(2.6rem,14vw,3.6rem);line-height:1.02;letter-spacing:.01em;margin:6px 0 14px;
    display:flex;flex-wrap:wrap;justify-content:center;gap:0 .32em;
  }
  #title .tw{display:inline-flex}
  #title .tl{display:inline-block;transform:rotate(var(--r));text-shadow:2px 3px 0 rgba(48,51,46,.14);animation:wiggle 3.6s ease-in-out var(--d) infinite}
  @keyframes wiggle{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) * -1)) translateY(-3px)}}

  /* ---------- Whimsical pastel drawers ---------- */
  .drawers{gap:16px}
  .drawer{border:2px solid var(--ink);overflow:hidden}
  .drawer.dB{background:#e9eee2;border-radius:26px 14px 28px 14px;transform:rotate(-.5deg);box-shadow:4px 5px 0 var(--sage)}
  .drawer.dU{background:#f6e6de;border-radius:14px 28px 14px 26px;transform:rotate(.5deg);box-shadow:4px 5px 0 var(--terracotta)}
  .dHead{font-family:"Fredoka","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:1.15rem;padding:14px 16px}
  .dHead .chev{
    width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex:none;
    font-size:1.2rem;line-height:1;padding-bottom:3px;opacity:1;color:var(--ink);
    transition:transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .dB .chev{background:var(--sage)}.dU .chev{background:var(--terracotta)}
  .dB .chev,.dU .chev{color:#fffaf4}
  .dSub{font-family:"Fredoka",system-ui,sans-serif;font-weight:500}
  .drawer .dBody{border-top:2px dashed transparent;background:rgba(255,250,244,.55)}
  .drawer.open .dBody{border-top-color:var(--ink)}
  .drawer .item{border-bottom:1.5px dotted rgba(48,51,46,.28)}
  .dB .item.active{background:#d5e0c9}.dU .item.active{background:#f0cfc2}
  .dB .item.active .dot{background:var(--sage);border-color:var(--ink)}
  .dU .item.active .dot{background:var(--terracotta);border-color:var(--ink)}
  .dot{border:2px solid var(--ink)}
  .iName{font-weight:500}
  .drawer .more{background:rgba(255,250,244,.7)}
  /* slower, softer open/close */
  .dBody{transition:max-height .7s cubic-bezier(.22,1,.36,1),opacity .5s ease .05s,border-top-color .4s ease}
  .drawer{transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
  .drawer.open{transform:rotate(0)}
  @media (prefers-reduced-motion: reduce){#title .tl{animation:none}.dBody,.drawer{transition:none}}
</style>
  
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>

<!-- MENU -->
<section id="menu" class="screen scroll active">
  <div class="card">
    <h1 id="title" aria-label="Le gros front"></h1>
    <div id="drawers" class="drawers"></div>
    <p class="status" id="menuNote"></p>
    <label id="customWrap" style="display:none">Your words (comma or new line separated)
      <textarea id="custom" placeholder="pizza, Eiffel Tower, karaoke..."></textarea>
    </label>
    <button id="startBtn" class="floatWord">Play!</button>
  </div>
</section>

<!-- SETTINGS -->
<section id="settings" class="screen scroll">
  <div class="card">
    <button class="secondary backBtn inline" aria-label="Back">← Back</button>
    <h1 style="font-size:1.5rem">Settings</h1>
    <label>Round length (seconds)
      <input type="number" id="secs" value="60" min="5" step="5" inputmode="numeric">
    </label>
    <label class="chk"><input type="checkbox" id="unlimited"> No time limit (you end the round yourself)</label>
    <label>Tilt needed to answer: <b id="tiltVal">40°</b>
      <input type="range" id="tiltDeg" min="25" max="65" step="5" value="40">
      <span class="small" style="margin:0;font-size:.8rem">Lower = more sensitive. Raise it if it answers by accident.</span>
    </label>
    <label class="chk"><input type="checkbox" id="touchOn" checked> Tap the screen to answer (bottom = correct, top = pass)</label>
    <button class="secondary" id="recalBtn">Recalibrate tilt direction next game</button>
    <p class="small" id="sensorNote"></p>
  </div>
</section>

<!-- AI THEME GENERATOR -->
<section id="gen" class="screen scroll">
  <div class="card">
    <button class="secondary backBtn inline" aria-label="Back">← Back</button>
    <h1 style="font-size:1.5rem">Generate a theme</h1>
    <label>Gemini API key
      <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <p class="status" style="opacity:.7;margin:0">Free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. It is saved only in this browser and sent only to Google.</p>
    <label>Theme (a word or a phrase)
      <input type="text" id="genTheme" placeholder="e.g. 90s cartoons, French rappers, things in a kitchen" maxlength="200" autocomplete="off">
    </label>
    <label>Number of entries
      <input type="number" id="genCount" value="150" min="10" max="500" step="10">
    </label>
    <details>
      <summary>Advanced</summary>
      <label>Model (leave empty to pick one automatically)
        <input type="text" id="genModel" placeholder="auto" autocapitalize="off" spellcheck="false">
      </label>
    </details>
    <button id="genBtn">Generate</button>
    <p class="status" id="genStatus"></p>
    <div id="genOut">
      <label>Theme name
        <input type="text" id="genName" maxlength="40" autocomplete="off">
      </label>
      <label><span id="genCountLbl">Entries</span> (one per line, edit freely)
        <textarea id="genList"></textarea>
      </label>
      <div class="row">
        <button id="genSaveBtn">Save theme</button>
        <button class="secondary" id="genDiscardBtn">Discard</button>
      </div>
    </div>
  </div>
</section>

<!-- PREP / CALIBRATION -->
<section id="prep" class="screen">
  <button class="backBtn" aria-label="Back">← Back</button>
  <div class="msg" id="prepMsg"></div>
  <div class="small" id="prepSub"></div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <button class="backBtn" aria-label="Back">← Back</button>
  <button class="secondary finishBtn" id="finishBtn" style="display:none">Finish round</button>
  <div id="hud"><span id="timer">60</span><span id="score">0</span></div>
  <div class="big" id="word"></div>
  <div id="rotate">Rotate your phone to landscape</div>
</section>

<!-- RESULTS -->
<section id="results" class="screen scroll">
  <div class="card">
    <p class="sub">Time's up!</p>
    <p class="score" id="finalScore">0</p>
    <ul class="res" id="resList"></ul>
    <div class="row">
      <button id="againBtn">Play again</button>
      <button class="secondary" id="menuBtn">Menu</button>
    </div>
  </div>
</section>

<!-- Settings cogwheel button (bottom right) -->
<button id="settingsBtn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="#30332e" stroke-width="1.8"

<!-- WORD LISTS: one file per list in lists/. To add one, create lists/<name>.js
     (copy an existing file) and add a matching <script> tag below. -->
<script src="lists/celebrities.js"></script>
<script src="lists/movies.js"></script>
<script src="lists/french-culture.js"></script>
<script src="lists/minecraft.js"></script>
<script src="lists/tv-series.js"></script>
<script src="lists/computer-science.js"></script>
<script src="lists/semiconductors.js"></script>
<script src="lists/video-games.js"></script>

<script>
(() => {
  /* ---------- Word lists come from lists/*.js (see <script> tags above) ---------- */
  const LISTS = window.LISTS || {};

  const DECKS = {};
  for (const [name, txt] of Object.entries(LISTS))
    DECKS[name] = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);


  const $ = s => document.querySelector(s);
  const screens = ["menu","settings","gen","prep","game","results"];
  const show = id => {
    screens.forEach(s => $("#"+s).classList.toggle("active", s===id));
    // The cog makes no sense while the phone is on your forehead or during results cleanup.
    document.body.classList.toggle("playing", id === "game" || id === "prep");
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const store = {
    get(k, d=null){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } },
    del(k){ try { localStorage.removeItem(k); } catch(e){} }
  };

  /* ---------- User themes (saved in this browser) ---------- */
  const UK = "fg_user_themes";
  let USER = {};
  try { USER = JSON.parse(store.get(UK, "{}")) || {}; } catch(e){ USER = {}; }
  let META = {};          // theme name -> the text it was generated from (used when asking for more)
  try { META = JSON.parse(store.get("fg_user_meta", "{}")) || {}; } catch(e){ META = {}; }
  function saveUser(){
    store.set("fg_user_meta", JSON.stringify(META));
    const ok = store.set(UK, JSON.stringify(USER));
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
    return ok;
  }

  /* ---------- Deck UI: two inline drawers (no popups) ---------- */
  const CUSTOM = "__custom__";
  let curDeck = "";              // the active theme: "b:<name>" (built-in), "u:<name>" (mine) or CUSTOM
  let DRAW = null;               // which drawers are open: {b:bool, u:bool}
  try { DRAW = JSON.parse(store.get("fg_drawers", "null")); } catch(e){}
  // state of the per-theme "AI generate more" panel
  let moreFor = "", moreCount = 100, moreBusy = false, moreMsg = { text: "", cls: "" }, undoInfo = null, confirmClear = "";

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const slug = n => n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "theme";
  const note = (msg, cls="") => { const n = $("#menuNote"); n.textContent = msg; n.className = "status " + cls; };

  function rebuildDecks(want){
    const has = v => v === CUSTOM || (typeof v === "string" && ((v.startsWith("b:") && DECKS[v.slice(2)]) || (v.startsWith("u:") && USER[v.slice(2)])));
    let v = want || store.get("fg_deck");
    if (!has(v) && has("b:" + v)) v = "b:" + v;      // old saved value without prefix
    if (!has(v)) v = Object.keys(DECKS).length ? "b:" + Object.keys(DECKS)[0] : "";
    pickDeck(v);
  }
  function pickDeck(v){
    curDeck = v || "";
    syncDeck(); renderDrawers();
  }
  function syncDeck(){ $("#customWrap").style.display = curDeck === CUSTOM ? "flex" : "none"; }
  function pickItem(v){ note(""); if (curDeck !== v) { moreFor = ""; confirmClear = ""; } pickDeck(v); store.set("fg_deck", v); }

  function renderDrawers(){
    const host = $("#drawers"), keep = {};
    host.querySelectorAll(".dBody").forEach(b => keep[b.dataset.d] = b.scrollTop);
    host.textContent = "";
    host.append(buildDrawer("b"), buildDrawer("u"));
    host.querySelectorAll(".dBody").forEach(b => { if (keep[b.dataset.d]) b.scrollTop = keep[b.dataset.d]; });
  }
  // Material Design style glyphs (same family as Nerd Fonts' nf-md set), drawn inline so they work offline
  const ICON = {
    export: "M5 20h14v-2H5v2zM12 2 6.5 7.5l1.4 1.4L11 5.8V16h2V5.8l3.1 3.1 1.4-1.4L12 2z",
    sparkle: "M19 1l-1.26 2.75L15 5l2.74 1.26L19 9l1.25-2.74L23 5l-2.75-1.25M9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5M19 15l-1.26 2.74L15 19l2.74 1.25L19 23l1.25-2.75L23 19l-2.75-1.26",
    trash: "M9 3v1H4v2h1v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6h1V4h-5V3H9m0 5h2v9H9V8m4 0h2v9h-2V8z",
    check: "M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"
  };
  const icon = d => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); s.append(p); return s; };
  function mini(ic, label, fn, cls, txt){
    const b = el("button", "seg " + (cls || ""));
    b.append(icon(ic)); if (txt) b.append(document.createTextNode(txt));
    b.setAttribute("aria-label", label); b.title = label;
    b.onclick = e => { e.stopPropagation(); fn(); };
    return b;
  }
  function itemRow(v, label, count, acts){
    const row = el("div", "item" + (curDeck === v ? " active" : ""));
    const main = el("div", "iMain");
    main.append(el("span", "dot"), el("span", "iName", label));
    if (count != null) main.append(el("span", "iCount", String(count)));
    main.onclick = () => pickItem(v);
    row.append(main); if (acts) row.append(acts);
    return row;
  }
  function buildDrawer(id){
    const isB = id === "b", open = !!(DRAW && DRAW[id]);
    const box = el("div", "drawer " + (isB ? "dB" : "dU") + (open ? " open" : "")); box.dataset.id = id;
    const names = isB ? Object.keys(DECKS) : Object.keys(USER);
    let sub = names.length + (isB ? " themes" : " saved");
    if (isB && curDeck.startsWith("b:")) sub = curDeck.slice(2);
    if (!isB && curDeck.startsWith("u:")) sub = curDeck.slice(2);
    if (!isB && curDeck === CUSTOM) sub = "your own words";
    const head = el("button", "dHead"); head.setAttribute("aria-expanded", String(open));
    head.append(el("span", "chev", "›"), el("span", "dTitle", isB ? "Built-in themes" : "Custom themes"), el("span", "dSub", sub));
    head.onclick = () => {
      DRAW = DRAW || {};
      const willOpen = !DRAW[id];
      DRAW[id] = willOpen;
      if (willOpen) DRAW[id === "b" ? "u" : "b"] = false;
      store.set("fg_drawers", JSON.stringify(DRAW));
      // toggle classes on the live elements (rebuilding the DOM would skip the CSS transition)
      document.querySelectorAll("#drawers .drawer").forEach(d => {
        const o = !!DRAW[d.dataset.id];
        d.classList.toggle("open", o);
        d.querySelector(".dHead").setAttribute("aria-expanded", String(o));
      });
    };
    const body = el("div", "dBody" + (!isB && moreFor && USER[moreFor] ? " tall" : "")); body.dataset.d = id;
    if (isB) {
      names.forEach(n => body.append(itemRow("b:" + n, n, DECKS[n].length)));
    } else {
      names.forEach(n => {
        const acts = el("div", "iActs");
        acts.append(
          mini(ICON.export, "Export as a .js list file", () => exportTheme(n), "s-export"),
          mini(ICON.sparkle, "Generate more entries with AI", () => { moreFor = moreFor === n ? "" : n; moreMsg = { text: "", cls: "" }; renderDrawers(); }, "s-more" + (moreFor === n ? " on" : "")),
          confirmClear === n
            ? mini(ICON.check, "Tap again to clear this theme", () => clearTheme(n), "s-clear warn", "Sure?")
            : mini(ICON.trash, "Clear this theme", () => clearTheme(n), "s-clear"));
        const sel = curDeck === "u:" + n;               // action strips only exist on the selected entry
        body.append(itemRow("u:" + n, n, USER[n].length, sel ? acts : null));
        if (sel && moreFor === n) body.append(morePanel(n));
      });
      if (!names.length) body.append(el("div", "empty", "No AI themes yet. Use Generate a theme below to make one."));
      body.append(itemRow(CUSTOM, "Type my own words…" , null));
      // Generate button integrated into the Custom drawer
      const genRow = el("div", "genWrap");
      const genBtn = el("button", "aiLink");
      genBtn.append(icon(ICON.sparkle), document.createTextNode("Generate with AI"));
      genBtn.onclick = () => { phase = "gen"; show("gen"); };
      genRow.append(genBtn);
      body.append(genRow);
    }
    box.append(head, body);
    return box;
  }

  function morePanel(n){
    const p = el("div", "more");
    p.append(el("p", "hint", "Sends your " + USER[n].length + " current entries to Gemini so it finds different ones."));
    const lab = el("label", null, "How many new entries?");
    const inp = el("input"); inp.type = "number"; inp.min = 10; inp.max = 500; inp.step = 10; inp.value = moreCount; inp.disabled = moreBusy;
    inp.oninput = () => { moreCount = Math.max(10, Math.min(500, parseInt(inp.value, 10) || 100)); };
    lab.append(inp); p.append(lab);
    const row = el("div", "row");
    const add = el("button", null, moreBusy ? "Working…" : "Add to list"); add.disabled = moreBusy; add.onclick = () => generateMore(n, "add");
    const rep = el("button", "secondary", "Replace list"); rep.disabled = moreBusy; rep.onclick = () => generateMore(n, "replace");
    row.append(add, rep); p.append(row);
    p.append(el("p", "hint", "Replace deletes the old entries once the new ones have arrived."));
    const st = el("p", "status" + (moreMsg.cls ? " " + moreMsg.cls : ""), moreMsg.text); st.id = "moreStatus"; p.append(st);
    if (moreMsg.needKey) { const b = el("button", "secondary", "Open Generate to add your key"); b.onclick = () => { phase = "gen"; show("gen"); }; p.append(b); }
    if (undoInfo && undoInfo.name === n && !moreBusy) {
      const u = el("button", "secondary", "Undo last change (back to " + undoInfo.list.length + " entries)");
      u.onclick = () => { USER[n] = undoInfo.list; undoInfo = null; saveUser(); moreMsg = { text: "Restored.", cls: "ok" }; renderDrawers(); };
      p.append(u);
    }
    return p;
  }
  const setMore = (text, cls="") => {
    moreMsg = { text, cls };
    const e = $("#moreStatus"); if (e) { e.textContent = text; e.className = "status " + cls; }
  };

  function exportTheme(name){
    const list = USER[name]; if (!list) return;
    const txt = "// Exported from Forehead Game. Put this file in lists/ and add a <script src> tag for it in index.html.\n" +
      "(window.LISTS = window.LISTS || {})[" + JSON.stringify(name) + "] = `\n" + list.join("\n") + "\n`;\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    a.download = slug(name) + ".js";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    note("Exported " + a.download, "ok");
  }
  function clearTheme(n){            // two taps instead of a confirm popup
    if (confirmClear !== n) {
      confirmClear = n; renderDrawers();
      setTimeout(() => { if (confirmClear === n) { confirmClear = ""; renderDrawers(); } }, 2500);
      return;
    }
    confirmClear = ""; delete USER[n]; delete META[n]; saveUser();
    if (moreFor === n) moreFor = "";
    if (curDeck === "u:" + n) rebuildDecks(); else renderDrawers();
    note('Cleared "' + n + '".');
  }

  (() => {
    const cols = ["var(--terracotta)", "var(--sage)", "var(--ochre)"], t = $("#title"); let i = 0;
    "Le gros front".split(" ").forEach((word, wi) => {
      const w = el("span", "tw");
      [...word].forEach(ch => {
        const c = el("span", "tl", ch); c.style.color = cols[i % 3];
        c.style.setProperty("--r", ((i * 7) % 9 - 4) + "deg"); c.style.setProperty("--d", (i * 0.17) + "s"); i++;
        w.append(c);
      });
      t.append(w);
    });
  })();
  $("#custom").value = store.get("fg_custom", "");
  rebuildDecks();
  if (!DRAW) DRAW = { b: !curDeck || curDeck.startsWith("b:"), u: curDeck.startsWith("u:") || curDeck === CUSTOM };
  if (DRAW.b && DRAW.u) {
    if (curDeck.startsWith("u:") || curDeck === CUSTOM) DRAW.b = false;
    else DRAW.u = false;
  }
  store.set("fg_drawers", JSON.stringify(DRAW));
  renderDrawers();

  $("#tiltDeg").value = store.get("fg_tilt", "40");
  $("#tiltVal").textContent = $("#tiltDeg").value + "°";
  $("#tiltDeg").oninput = e => { $("#tiltVal").textContent = e.target.value + "°"; store.set("fg_tilt", e.target.value); };
  $("#secs").value = store.get("fg_secs", "60");
  $("#secs").onchange = e => store.set("fg_secs", e.target.value);
  const syncUnlimited = () => { $("#secs").disabled = $("#unlimited").checked; };
  $("#unlimited").checked = store.get("fg_unlimited", "0") === "1"; syncUnlimited();
  $("#unlimited").onchange = e => { store.set("fg_unlimited", e.target.checked ? "1" : "0"); syncUnlimited(); };
  $("#settingsBtn").onclick = () => { phase = "settings"; show("settings"); };
  $("#touchOn").checked = store.get("fg_touch", "1") !== "0";
  $("#touchOn").onchange = e => store.set("fg_touch", e.target.checked ? "1" : "0");


  /* ---------- Sensor ---------- */
  // Tilt of the screen from vertical, in degrees (0 = upright on the forehead, +/-90 = facing floor/ceiling).
  // It comes from the direction of gravity (accelerometer), smoothed, so a shake or bump can't fake a tilt.
  // The sign differs between iOS and Android; "dir" (calibrated once) fixes that.
  let ang = 0, angInit = false, lastT = 0, badSince = 0;
  let sensorOn = false;
  let dir = 0;               // +1 or -1: sign of the angle change when tilting DOWN. 0 = unknown.
  try { dir = parseInt(localStorage.getItem("fg_dir") || "0", 10) || 0; } catch(e){}
  const TAU = 80;            // smoothing time constant in ms (higher = calmer but slower)

  function feed(deg, t){
    if (!angInit) { ang = deg; angInit = true; }
    else ang += (deg - ang) * (1 - Math.exp(-Math.max(1, Math.min(200, t - lastT)) / TAU));
    lastT = t; sensorOn = true;
  }

  let motionSeen = false, sensorWhy = "";
  function onMotion(e){
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null || a.z == null) return;
    motionSeen = true;
    const t = performance.now(), g = Math.hypot(a.x, a.y, a.z);
    if (g < 1) return;
    // Normalising by |g| removes most of the effect of linear acceleration. While the phone is being
    // shaken hard the reading is unreliable, so skip it (but give up skipping after 1.5 s in case the
    // device reports gravity in odd units).
    if (Math.abs(g - 9.81) > 5) { if (!badSince) badSince = t; if (t - badSince < 1500) { sensorOn = true; return; } }
    else badSince = 0;
    feed(Math.asin(Math.max(-1, Math.min(1, a.z / g))) * 180 / Math.PI, t);
  }
  // Fallback if no accelerometer data: derive the same angle from the fused orientation angles
  function onOrient(e){
    if (motionSeen || e.beta == null || e.gamma == null) return;
    const r = Math.PI / 180, zc = Math.cos(e.beta * r) * Math.cos(e.gamma * r);
    feed(Math.asin(Math.max(-1, Math.min(1, zc))) * 180 / Math.PI, performance.now());
  }
  let listening = false;
  function listen(){
    if (listening) return; listening = true;
    window.addEventListener("devicemotion", onMotion);
    window.addEventListener("deviceorientation", onOrient);
    window.addEventListener("deviceorientationabsolute", onOrient);
  }

  async function enableSensor(permP){
    sensorWhy = "";
    if (!window.isSecureContext) { sensorWhy = "This page isn't served over HTTPS (open the https:// GitHub Pages link, not a file)."; return false; }
    // A refused/failed permission prompt is not fatal: some browsers expose the prompt API but still
    // deliver motion data, so we listen anyway and only complain if nothing arrives.
    let denied = "";
    try {
      if (permP) {
        const r = await permP;
        if (r !== "granted") denied = "Motion access was denied. On iPhone: fully close Safari, reopen the page and tap Allow (or Settings → Safari → Motion & Orientation Access).";
      }
    } catch(e){ denied = "Motion permission failed: " + (e && e.message || e); }
    listen();
    const t0 = performance.now();
    while (!sensorOn && performance.now() - t0 < (denied ? 1500 : 3000)) await sleep(100);
    if (!sensorOn) sensorWhy = denied || "No motion data received. On Android Chrome check Site settings → Motion sensors is allowed (and Battery saver is off); in-app browsers often block sensors, so use Chrome/Safari directly.";
    return sensorOn;
  }

  // On platforms that need no permission prompt, start listening right away
  if (typeof DeviceMotionEvent === "undefined" || typeof DeviceMotionEvent.requestPermission !== "function") listen();

  /* ---------- Game state ---------- */
  let words = [], queue = [], correct = [], passed = [];
  let phase = "menu", armed = false, neutral = 0, lock = false, endAt = 0, wakeLock = null;
  let touchMode = false;

  const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
  const nextWord = () => { if (!queue.length) queue = shuffle(words.slice()); return queue.pop(); };

  function getWords(){
    if (curDeck === CUSTOM) {
      const txt = $("#custom").value;
      try { localStorage.setItem("fg_custom", txt); } catch(e){}
      return txt.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    }
    const v = curDeck;
    if (v.startsWith("u:")) return USER[v.slice(2)] || [];
    return v.startsWith("b:") ? (DECKS[v.slice(2)] || []) : [];
  }

  /* ---------- Feedback (sound / vibration) ---------- */
  let ac;
  function ctx(){
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  // Plain beep (countdown, start, end)
  function beep(freq, dur=0.15){
    try {
      const c = ctx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch(e){}
  }
  // CLING: bright bell made of inharmonic partials with a fast attack and a ringing decay
  function bell(){
    try {
      const c = ctx(), t0 = c.currentTime;
      const strike = (t, f, vol) => {
        [[1,1,1.3],[2.76,0.55,0.9],[5.4,0.3,0.55],[8.93,0.15,0.35]].forEach(([ratio, amp, dec]) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = "sine"; o.frequency.value = f * ratio;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol * amp, t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
          o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dec + 0.05);
        });
      };
      strike(t0, 1320, 0.28);          // main hit
      strike(t0 + 0.09, 1980, 0.18);   // quick higher "ling" on top
    } catch(e){}
  }
  // BRRRROMP: growling sawtooth sliding down, chopped by a fast tremolo, then a final low "omp"
  function womp(){
    try {
      const c = ctx(), t = c.currentTime, end = t + 0.75;
      const o1 = c.createOscillator(), o2 = c.createOscillator();
      o1.type = "sawtooth"; o2.type = "square";
      o1.frequency.setValueAtTime(250, t);
      o1.frequency.exponentialRampToValueAtTime(150, t + 0.4);
      o1.frequency.exponentialRampToValueAtTime(70, end);
      o2.frequency.setValueAtTime(252, t);
      o2.frequency.exponentialRampToValueAtTime(152, t + 0.4);
      o2.frequency.exponentialRampToValueAtTime(71, end);
      const lp = c.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(300, end);
      // "brrrr": fast amplitude wobble
      const grow = c.createGain(); grow.gain.value = 0.55;
      const lfo = c.createOscillator(), lfoAmt = c.createGain();
      lfo.frequency.value = 38; lfoAmt.gain.value = 0.45;
      lfo.connect(lfoAmt); lfoAmt.connect(grow.gain);
      const env = c.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
      env.gain.setValueAtTime(0.32, t + 0.5);
      env.gain.exponentialRampToValueAtTime(0.0001, end);
      o1.connect(lp); o2.connect(lp); lp.connect(grow); grow.connect(env); env.connect(c.destination);

${task}

      (m.supportedGenerationMethods || []).includes("generateContent") &&

      !/image|tts|audio|live|embedding|robotics|computer|thinking|native|vision|learnlm|-exp/.test(m.name));

        contents: [{ parts: [{ text: prompt }] }],

          ...(v.think ? { thinkingConfig: v.think } : {}),
          ...(v.plain ? {} : { responseSchema: { type: "OBJECT", properties: { entries: { type: "ARRAY", items: { type: "STRING" } } }, required: ["entries"] } })

    if (!e.status && (e instanceof TypeError || e.name === "NetworkError" || /NetworkError|Failed to fetch|Load failed|fetch resource/i.test(e.message || "")))

  // Sends a prompt to Gemini: picks models, adapts the request format, skips slow models, retries.

    const note = !isSecureContext ? "Not HTTPS: motion sensors are blocked on this page."
      : sensorOn ? "Motion sensor working (tilt " + Math.round(ang) + "°)"
      : "Sensor: no data yet (move your phone). " + (/Firefox/.test(ua) ? "Firefox: see tips below." : "");
    $("#sensorNote").textContent = note;
  }, 300);

  /* ---------- PWA: make it installable / offline ---------- */
  if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>

<script>
/* A tiny, odd little world behind the game: slow contour currents + hand-drawn oddities. */
(() => {
  const canvas = document.getElementById("ambient");
  if (!canvas) return;
  const ctx = canvas.getContext("2d", { alpha: true });
  if (!ctx) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let w = 0, h = 0, dpr = 1, raf = 0, last = 0, time = 0;
  const palette = ["#c47b62", "#87977a", "#c1a36b", "#a99a83"];
  const oddities = [
    {x:.13,y:.19,s:1.0,k:0}, {x:.83,y:.16,s:.8,k:1},
    {x:.91,y:.69,s:1.05,k:2}, {x:.18,y:.82,s:.78,k:3},
    {x:.54,y:.09,s:.62,k:1}, {x:.69,y:.88,s:.9,k:0},
    {x:.045,y:.51,s:.7,k:2}, {x:.96,y:.39,s:.68,k:3}
  ];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.7);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(0);
  }

  function contour(cx, cy, base, seed, t) {
    ctx.beginPath();
    const steps = 150;
    for (let i = 0; i <= steps; i++) {
      const a = i / steps * Math.PI * 2;
      const wobble =
        Math.sin(a * 3 + seed + t * .16) * 8 +
        Math.sin(a * 5 - seed * 1.7 + t * .11) * 4.5 +
        Math.cos(a * 2 + seed * .7 - t * .09) * 5;
      const r = base + wobble;
      const x = cx + Math.cos(a) * r * 1.18;
      const y = cy + Math.sin(a) * r * .78;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function star(x, y, s) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const r = i % 2 ? s * .28 : s;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (!i) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + s * 1.35, y - s * .9, s * .16, 0, Math.PI * 2); ctx.fill();
  }

  function eye(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.quadraticCurveTo(x, y - s * .78, x + s, y);
    ctx.quadraticCurveTo(x, y + s * .78, x - s, y);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, s * .22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + s * 1.5, y - s * .85, s * .12, 0, Math.PI * 2); ctx.fill();
  }

  function spiral(x, y, s, t) {
    ctx.beginPath();
    for (let i = 0; i <= 65; i++) {
      const a = i / 65 * Math.PI * 3.2 + t * .05;
      const r = s * (.08 + i / 65 * .75);
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (!i) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  function worm(x, y, s, t) {
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.bezierCurveTo(x - s * .45, y - s * (1 + Math.sin(t * .3) * .12),
                      x + s * .35, y + s * .9, x + s, y - s * .1);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x + s * .48, y - s * .2, s * .07, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    // Broad, faint contour islands. Their outlines gently breathe rather than scroll.
    const scale = Math.min(w, h);
    const islands = [
      {x:.02,y:.08,r:scale*.22,seed:1.1},
      {x:.98,y:.27,r:scale*.19,seed:2.8},
      {x:.77,y:1.02,r:scale*.23,seed:4.2},
      {x:.18,y:.91,r:scale*.16,seed:5.4}
    ];
    islands.forEach((p, n) => {
      ctx.save();
      ctx.translate(p.x * w, p.y * h);
      ctx.lineWidth = 1;
      ctx.strokeStyle = palette[n] + "42";
      for (let j = 0; j < 5; j++) contour(0, 0, p.r * (.48 + j * .16), p.seed + j * .63, t);
      ctx.restore();
    });

    // Tiny marginalia: part star chart, part doodle left in a notebook.
    oddities.forEach((o, i) => {
      const drift = Math.sin(t * .12 + i * 1.8) * 5;
      const x = o.x * w + drift;
      const y = o.y * h + Math.cos(t * .1 + i) * 4;
      const s = Math.max(7, Math.min(13, scale * .014)) * o.s;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(t * .08 + i) * .12);
      ctx.lineWidth = 1.25;
      ctx.strokeStyle = palette[o.k] + "99";
      ctx.fillStyle = palette[o.k] + "99";
      if (o.k === 0) star(0, 0, s);
      else if (o.k === 1) eye(0, 0, s);
      else if (o.k === 2) spiral(0, 0, s, t + i);
      else worm(0, 0, s * 1.25, t + i);
      ctx.restore();
    });

    // A few almost invisible specks, like dust caught in the light.
    for (let i = 0; i < 28; i++) {
      const x = ((i * 137.51) % 997) / 997 * w;
      const y = ((i * 271.83) % 991) / 991 * h;
      const pulse = .45 + .35 * Math.sin(t * .25 + i * 2);
      ctx.fillStyle = "#9c927f" + Math.round(pulse * 70).toString(16).padStart(2, "0");
      ctx.beginPath(); ctx.arc(x, y, i % 5 === 0 ? 1.35 : .75, 0, Math.PI * 2); ctx.fill();
    }
  }

  function frame(now) {
    if (now - last > 40) { time += .04; draw(time); last = now; }
    raf = requestAnimationFrame(frame);
  }
  function start() {
    cancelAnimationFrame(raf);
    if (reduceMotion.matches) { draw(0); return; }
    raf = requestAnimationFrame(frame);
  }
  window.addEventListener("resize", resize, {passive:true});
  if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", start);
  resize();
  start();
})();
</script>
